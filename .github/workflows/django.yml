name: Django CI

on:  # when does this action run?
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:  # what happens when above actions happen?
  build:

    runs-on: ubuntu-latest  # what OS we run on (cloud Ubuntu server)
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test
